version: 2
updates:
  # Minor and patch updates arrive as one pull request per folder, not one per package.
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
